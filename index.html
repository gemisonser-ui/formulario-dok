<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOK - Registro de Produtividade</title>
    <style>
        :root { --cor-fundo-dok: #f8f9f9; --verde-dok: #48b087; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: var(--cor-fundo-dok); padding: 20px; color: #333; }
        .container { background-color: var(--cor-fundo-dok); max-width: 850px; margin: 0 auto; border: 1.5px solid #000; padding: 25px; box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--verde-dok); padding-bottom: 15px; margin-bottom: 20px; }
        .logo-oficial { max-width: 280px; height: auto; }
        .titulo-doc { text-align: right; color: var(--verde-dok); }
        .titulo-doc h2 { margin: 0; font-size: 20px; font-weight: 900; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        td { border: 1px solid #000; padding: 10px; font-size: 14px; }
        label.rotulo { display: block; font-weight: bold; margin-bottom: 2px; }
        input, select, textarea { width: 100%; border: none; outline: none; background: transparent; font-size: 14px; box-sizing: border-box; font-family: inherit; }
        select { cursor: pointer; appearance: none; -webkit-appearance: none; }
        select:disabled { cursor: not-allowed; color: #888; }
        .banner-secao { background: var(--verde-dok); color: white; text-align: center; font-weight: 900; padding: 8px; border: 1px solid #000; text-transform: uppercase; margin-top: 10px; }
        .check-table th { border: 1px solid #000; padding: 8px; background: rgba(0,0,0,0.03); font-size: 12px; text-transform: uppercase; }
        .check-table td { text-align: center; height: 45px; padding: 5px; }

        .input-qtd { text-align: center; font-weight: bold; color: #000000; }

        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number]:hover::-webkit-inner-spin-button,
        input[type=number]:hover::-webkit-outer-spin-button {
            -webkit-appearance: inner-spin-button;
            opacity: 1;
        }
        input[type=number] { -moz-appearance: textfield; }
        input[type=number]:hover { -moz-appearance: number-input; }

        .label-texto { display: block; margin-top: 15px; font-weight: bold; font-size: 13px; text-transform: uppercase; color: #555; }
        textarea { height: 60px; border: 1px solid #000; padding: 8px; resize: none; }
        .btn-enviar { background: var(--verde-dok); color: white; border: none; padding: 18px; font-size: 18px; font-weight: bold; cursor: pointer; width: 100%; border-radius: 4px; margin-top: 15px; text-transform: uppercase; transition: 0.3s; }
        .btn-enviar:hover:not(:disabled) { background: #3a8e6d; }
        .btn-enviar:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <form id="formClinica" autocomplete="off">
        <div class="header">
            <img src="https://lh3.googleusercontent.com/d/1k2nS1fibAd8eX25SAueMB-fvkoxLMKQS" alt="DOK Hospital" class="logo-oficial">
            <div class="titulo-doc"><h2>Registro de Atendimento</h2></div>
        </div>

        <table style="margin-bottom: 15px;">
            <tr>
                <td style="width: 34%;">
                    <label class="rotulo" for="unidade">Unidade DOK:</label>
                    <select autocomplete="off" name="unidade" id="unidade" required disabled onchange="atualizarFiltros()">
                        <option value="">Carregando...</option>
                    </select>
                </td>
                <td style="width: 33%;">
                    <label class="rotulo" for="veterinario">Veterinário:</label>
                    <select autocomplete="off" name="veterinario" id="veterinario" required disabled>
                        <option value="">Aguardando Unidade...</option>
                    </select>
                </td>
                <td style="width: 33%;">
                    <label class="rotulo" for="tipo_consulta">Tipo de Consulta:</label>
                    <select autocomplete="off" name="tipo_consulta" id="tipo_consulta" required>
                        <option value="">Selecione...</option>
                        <option value="Primeira consulta">Primeira consulta</option>
                        <option value="Consulta retorno">Consulta retorno</option>
                    </select>
                </td>
            </tr>
        </table>

        <table>
            <tr>
                <td style="width: 40%;"><label class="rotulo" for="paciente">Paciente:</label><input autocomplete="off" type="text" id="paciente" name="paciente" required></td>
                <td style="width: 25%;"><label class="rotulo" for="peso">Peso (kg):</label><input autocomplete="off" type="number" step="0.1" min="0.1" id="peso" name="peso"></td>
                <td style="width: 35%;"><label class="rotulo" for="data_atendimento">Data Atendimento:</label><input autocomplete="off" type="date" id="data_atendimento" name="data_atendimento" required></td>
            </tr>
            <tr>
                <td colspan="2"><label class="rotulo" for="tutor">Tutor:</label><input autocomplete="off" type="text" id="tutor" name="tutor"></td>
                <td>
                    <label class="rotulo" for="especie">Espécie:</label>
                    <select autocomplete="off" name="especie" id="especie" required>
                        <option value="">Selecione...</option>
                        <option value="Cão">Cão</option>
                        <option value="Gato">Gato</option>
                        <option value="Outros">Outros</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td colspan="2"><label class="rotulo" for="raca">Raça:</label><input autocomplete="off" type="text" id="raca" name="raca"></td>
                <td>
                    <label class="rotulo" for="plano">Plano:</label>
                    <select autocomplete="off" name="plano" id="plano" required disabled>
                        <option value="">Aguardando Unidade...</option>
                    </select>
                </td>
            </tr>
        </table>

        <div class="banner-secao">DESDOBRAMENTOS (QUANTIDADES)</div>
        <table class="check-table">
            <thead>
                <tr>
                    <th>Cirurgia</th><th>Internação</th><th>Aplicação</th><th>Vacina</th><th>Laboratório</th><th>Imagem</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><input autocomplete="off" type="number" name="cirurgia" class="input-qtd" min="0"></td>
                    <td><input autocomplete="off" type="number" name="internacao" class="input-qtd" min="0"></td>
                    <td><input autocomplete="off" type="number" name="aplicacao" class="input-qtd" min="0"></td>
                    <td><input autocomplete="off" type="number" name="vacina" class="input-qtd" min="0"></td>
                    <td><input autocomplete="off" type="number" name="laboratorio" class="input-qtd" min="0"></td>
                    <td><input autocomplete="off" type="number" name="imagem" class="input-qtd" min="0"></td>
                </tr>
            </tbody>
        </table>

        <span class="label-texto">Conduta clínica / suspeita diagnóstica:</span>
        <textarea autocomplete="off" name="conduta"></textarea>

        <span class="label-texto">Exames sugeridos:</span>
        <textarea autocomplete="off" name="exames_sugeridos"></textarea>

        <button type="submit" id="btnSubmit" class="btn-enviar" disabled>CARREGANDO...</button>
    </form>
</div>

<script>
    // URL do deploy do Apps Script (Web App). Mantenha atualizada após cada novo deploy.
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbzwVOjLcWg5RtpbPEswyPvF8PPPtlmJiXx9s_3ITTptfgXIWaWytYNTUZbq3i9w3Rxb/exec";

    // Deve ser IDÊNTICO ao TOKEN_FORMULARIO definido no Code.gs.
    // É uma barreira básica contra spam automatizado, não uma segurança real
    // (qualquer pessoa pode ler este valor no código-fonte da página).
    const TOKEN_FORMULARIO = "CiBlDfleHijUQjmD_qJXqMZ0gk7NwaQA";

    let configData = {}; // preenchido dinamicamente a partir da aba "Config" da planilha

    function definirDataPadrao() {
        const agora = new Date();
        const offsetMs = agora.getTimezoneOffset() * 60000;
        const dataLocal = new Date(agora.getTime() - offsetMs);
        document.getElementById('data_atendimento').value = dataLocal.toISOString().split('T')[0];
    }

    function popularUnidades() {
        const unidadeSelect = document.getElementById('unidade');
        const unidades = Object.keys(configData).sort();
        unidadeSelect.innerHTML = '<option value="">Selecione...</option>';
        unidades.forEach(function (u) {
            const opt = document.createElement('option');
            opt.value = u;
            opt.innerHTML = u;
            unidadeSelect.appendChild(opt);
        });
        unidadeSelect.disabled = false;
    }

    function carregarConfig() {
        const btn = document.getElementById('btnSubmit');
        btn.disabled = true;
        btn.innerText = "CARREGANDO CONFIGURAÇÕES...";

        fetch(URL_APPS_SCRIPT)
            .then(function (res) { return res.json(); })
            .then(function (resultado) {
                if (resultado.status !== 'success') {
                    throw new Error(resultado.message || 'Erro ao carregar configurações.');
                }
                configData = resultado.data;
                popularUnidades();
                btn.disabled = false;
                btn.innerText = "REGISTRAR ATENDIMENTO";
            })
            .catch(function (err) {
                console.error(err);
                btn.innerText = "ERRO AO CARREGAR — RECARREGUE A PÁGINA";
                alert("Não foi possível carregar veterinários e planos. Recarregue a página.\nDetalhe: " + err.message);
            });
    }

    function atualizarFiltros() {
        const unidade = document.getElementById('unidade').value;
        const vetSelect = document.getElementById('veterinario');
        const planoSelect = document.getElementById('plano');
        const dadosUnidade = configData[unidade];

        vetSelect.innerHTML = '<option value="">Selecione o Veterinário...</option>';
        planoSelect.innerHTML = '<option value="">Selecione o Plano...</option>';

        if (unidade && dadosUnidade) {
            vetSelect.disabled = false;
            (dadosUnidade.veterinarios || []).forEach(function (nome) {
                const opt = document.createElement('option');
                opt.value = nome;
                opt.innerHTML = nome;
                vetSelect.appendChild(opt);
            });

            planoSelect.disabled = false;
            const planos = dadosUnidade.planos && dadosUnidade.planos.length ? dadosUnidade.planos : ["Particular"];
            planos.forEach(function (plano) {
                const opt = document.createElement('option');
                opt.value = plano;
                opt.innerHTML = plano;
                planoSelect.appendChild(opt);
            });
        } else {
            vetSelect.disabled = true;
            vetSelect.innerHTML = '<option value="">Aguardando Unidade...</option>';
            planoSelect.disabled = true;
            planoSelect.innerHTML = '<option value="">Aguardando Unidade...</option>';
        }
    }

    document.getElementById('formClinica').addEventListener('submit', function (e) {
        e.preventDefault();
        const btn = document.getElementById('btnSubmit');
        btn.innerText = "Sincronizando...";
        btn.disabled = true;

        const formData = new FormData(this);
        const dados = { token: TOKEN_FORMULARIO };
        formData.forEach(function (value, key) { dados[key] = value; });

        fetch(URL_APPS_SCRIPT, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita preflight CORS no Apps Script
            body: JSON.stringify(dados)
        })
            .then(function (res) { return res.json(); })
            .then(function (resultado) {
                if (resultado.status !== 'success') {
                    throw new Error(resultado.message || 'Erro desconhecido ao registrar.');
                }
                alert("Sucesso! Registro efetuado na base DOK.");
                document.getElementById('formClinica').reset();
                definirDataPadrao();
                document.getElementById('veterinario').disabled = true;
                document.getElementById('veterinario').innerHTML = '<option value="">Aguardando Unidade...</option>';
                document.getElementById('plano').disabled = true;
                document.getElementById('plano').innerHTML = '<option value="">Aguardando Unidade...</option>';
                btn.innerText = "REGISTRAR ATENDIMENTO";
                btn.disabled = false;
            })
            .catch(function (err) {
                alert("Erro ao registrar: " + err.message + "\nO registro NÃO foi salvo. Tente novamente.");
                btn.innerText = "TENTAR NOVAMENTE";
                btn.disabled = false;
            });
    });

    definirDataPadrao();
    carregarConfig();
</script>

</body>
</html>
